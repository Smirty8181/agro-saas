services:
  postgres:
    image: postgres:16-alpine
    container_name: agro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro_secret
      POSTGRES_DB: agro_db
    ports:
      - '5432:5432'
    volumes:
      - agro_pg_data:/var/lib/postgresql/data

volumes:
  agro_pg_data:
