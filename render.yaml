services:
  - type: web
    name: agro-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cd server && npm ci
    startCommand: cd server && npm run migrate && npm run seed && NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: YANDEX_WEATHER_KEY
        sync: false
      - key: PORT
        value: 10000
